name: Title Generation

on:
  schedule:
    # Run 10 minutes after sync (every 6 hours)
    - cron: '10 */6 * * *'
  workflow_dispatch:

jobs:
  generate-titles:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Titles for All Users
        run: |
          curl -X POST "${{ secrets.VERCEL_URL }}/api/title" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"userId":"all"}' \
            --fail
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
