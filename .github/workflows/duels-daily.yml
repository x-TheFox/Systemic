name: Daily Duel Resolution

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Duels
        run: |
          set -euo pipefail

          BASE_URL="${{ secrets.VERCEL_URL }}"
          AUTH="Bearer ${{ secrets.CRON_SECRET }}"

          if [ -z "$BASE_URL" ]; then
            echo "ERROR: VERCEL_URL secret is not set"
            exit 1
          fi

          case "$BASE_URL" in
            http://*|https://*) ;;
            *) BASE_URL="https://$BASE_URL" ;;
          esac

          echo "=== Base URL: $BASE_URL ==="

          curl -sS --fail --max-time 60 --connect-timeout 10 \
            -X POST "${BASE_URL}/api/duels/resolve" \
            -H "Authorization: ${AUTH}" \
            -H "Content-Type: application/json"

          echo ""
          echo "=== Done ==="
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
