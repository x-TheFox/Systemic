name: Daily Duel Resolution

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Duels
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/duels/resolve" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
