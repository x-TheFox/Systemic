name: Systemics Sync Engine

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all users (one per request)
        run: |
          set -e
          BASE_URL="${{ secrets.VERCEL_URL }}"
          AUTH="Bearer ${{ secrets.CRON_SECRET }}"

          echo "=== Fetching user list ==="
          USERS_JSON=$(curl -s -X POST "${BASE_URL}/api/sync" \
            -H "Authorization: ${AUTH}" \
            -H "Content-Type: application/json")

          echo "Users response: $USERS_JSON"

          COUNT=$(echo "$USERS_JSON" | jq -r '.count // 0')

          if [ "$COUNT" -eq 0 ]; then
            echo "No users to sync."
            exit 0
          fi

          echo "=== Syncing $COUNT users one-by-one ==="

          echo "$USERS_JSON" | jq -r '.users[].id' | while read -r USER_ID; do
            echo "→ Syncing user $USER_ID..."
            RESPONSE=$(curl -s -X POST "${BASE_URL}/api/sync?userId=${USER_ID}" \
              -H "Authorization: ${AUTH}" \
              -H "Content-Type: application/json")
            echo "  Response: $RESPONSE"
            sleep 2  # brief pause between users
          done

          echo "=== Sync complete ==="
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
