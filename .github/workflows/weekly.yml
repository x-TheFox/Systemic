name: Weekly Post-Mortem

on:
  schedule:
    # Every Sunday at 8:00 PM UTC
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Post-Mortem API
        run: |
          curl -X POST "${{ secrets.VERCEL_URL }}/api/weekly" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Process Badge Queue After Weekly
        run: |
          curl -X POST "${{ secrets.VERCEL_URL }}/api/badges/process-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail || true
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Refresh Titles After Weekly
        run: |
          curl -X POST "${{ secrets.VERCEL_URL }}/api/title" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"userId":"all"}' \
            --fail || true
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
