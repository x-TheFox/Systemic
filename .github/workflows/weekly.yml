name: Weekly Post-Mortem

on:
  schedule:
    # Every Sunday at 8:00 PM UTC
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Post-Mortem API
        run: |
          set -euo pipefail

          run_task() (
            set -euo pipefail

            BASE_URL="${{ secrets.VERCEL_URL }}"
            AUTH="Bearer ${{ secrets.CRON_SECRET }}"

            if [ -z "$BASE_URL" ]; then
              echo "ERROR: VERCEL_URL secret is not set"
              exit 1
            fi

            case "$BASE_URL" in
              http://*|https://*) ;;
              *) BASE_URL="https://$BASE_URL" ;;
            esac

            echo "=== Base URL: $BASE_URL ==="
            echo "=== Triggering weekly report ==="

            curl -sS --fail --max-time 60 --connect-timeout 10 \
              -X POST "${BASE_URL}/api/weekly" \
              -H "Authorization: ${AUTH}" \
              -H "Content-Type: application/json"

            echo ""
            echo "=== Weekly report triggered ==="
          )

          ATTEMPT=1
          MAX_ATTEMPTS=2

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            if run_task; then
              break
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              DELAY_MINUTES=$((RANDOM % 16 + 5))
              echo "Task failed. Re-running in ${DELAY_MINUTES} minute(s)..."
              sleep $((DELAY_MINUTES * 60))
            else
              echo "Task failed after ${MAX_ATTEMPTS} attempt(s)."
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Process Badge Queue After Weekly
        run: |
          set -euo pipefail

          run_task() (
            set -euo pipefail

            BASE_URL="${{ secrets.VERCEL_URL }}"
            AUTH="Bearer ${{ secrets.CRON_SECRET }}"

            case "$BASE_URL" in
              http://*|https://*) ;;
              *) BASE_URL="https://$BASE_URL" ;;
            esac

            echo "=== Processing badge queue ==="

            curl -sS --fail --max-time 60 --connect-timeout 10 \
              -X POST "${BASE_URL}/api/badges/process-queue" \
              -H "Authorization: ${AUTH}" \
              -H "Content-Type: application/json"

            echo ""
            echo "=== Done ==="
          )

          ATTEMPT=1
          MAX_ATTEMPTS=2

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            if run_task; then
              break
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              DELAY_MINUTES=$((RANDOM % 16 + 5))
              echo "Task failed. Re-running in ${DELAY_MINUTES} minute(s)..."
              sleep $((DELAY_MINUTES * 60))
            else
              echo "Task failed after ${MAX_ATTEMPTS} attempt(s). Continuing."
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Refresh Titles After Weekly
        run: |
          set -euo pipefail

          run_task() (
            set -euo pipefail

            BASE_URL="${{ secrets.VERCEL_URL }}"
            AUTH="Bearer ${{ secrets.CRON_SECRET }}"

            case "$BASE_URL" in
              http://*|https://*) ;;
              *) BASE_URL="https://$BASE_URL" ;;
            esac

            echo "=== Refreshing titles ==="

            curl -sS --fail --max-time 60 --connect-timeout 10 \
              -X POST "${BASE_URL}/api/title" \
              -H "Authorization: ${AUTH}" \
              -H "Content-Type: application/json" \
              -d '{"userId":"all"}'

            echo ""
            echo "=== Done ==="
          )

          ATTEMPT=1
          MAX_ATTEMPTS=2

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            if run_task; then
              break
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              DELAY_MINUTES=$((RANDOM % 16 + 5))
              echo "Task failed. Re-running in ${DELAY_MINUTES} minute(s)..."
              sleep $((DELAY_MINUTES * 60))
            else
              echo "Task failed after ${MAX_ATTEMPTS} attempt(s). Continuing."
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
