name: Weekly Post-Mortem

on:
  schedule:
    # Every Sunday at 8:00 PM UTC
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Post-Mortem API
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 2
          command: |
            set -euo pipefail

            BASE_URL="${VERCEL_URL}"
            AUTH="Bearer ${CRON_SECRET}"

            if [ -z "$BASE_URL" ]; then
              echo "ERROR: VERCEL_URL secret is not set"
              exit 1
            fi

            case "$BASE_URL" in
              http://*|https://*) ;;
              *) BASE_URL="https://$BASE_URL" ;;
            esac

            echo "=== Base URL: $BASE_URL ==="
            echo "=== Triggering weekly report ==="

            curl -sS --fail --max-time 60 --connect-timeout 10 \
              -X POST "${BASE_URL}/api/weekly" \
              -H "Authorization: ${AUTH}" \
              -H "Content-Type: application/json"

            echo ""
            echo "=== Weekly report triggered ==="
          on_retry_command: |
            DELAY_MINUTES=$((RANDOM % 16 + 5))
            echo "Task failed. Re-running in ${DELAY_MINUTES} minute(s)..."
            sleep $((DELAY_MINUTES * 60))
          retry_wait_seconds: 0
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Process Badge Queue After Weekly
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 2
          command: |
            set -euo pipefail

            BASE_URL="${VERCEL_URL}"
            AUTH="Bearer ${CRON_SECRET}"

            case "$BASE_URL" in
              http://*|https://*) ;;
              *) BASE_URL="https://$BASE_URL" ;;
            esac

            echo "=== Processing badge queue ==="

            curl -sS --fail --max-time 60 --connect-timeout 10 \
              -X POST "${BASE_URL}/api/badges/process-queue" \
              -H "Authorization: ${AUTH}" \
              -H "Content-Type: application/json"

            echo ""
            echo "=== Done ==="
          on_retry_command: |
            DELAY_MINUTES=$((RANDOM % 16 + 5))
            echo "Task failed. Re-running in ${DELAY_MINUTES} minute(s)..."
            sleep $((DELAY_MINUTES * 60))
          retry_wait_seconds: 0
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Refresh Titles After Weekly
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 2
          command: |
            set -euo pipefail

            BASE_URL="${VERCEL_URL}"
            AUTH="Bearer ${CRON_SECRET}"

            case "$BASE_URL" in
              http://*|https://*) ;;
              *) BASE_URL="https://$BASE_URL" ;;
            esac

            echo "=== Refreshing titles ==="

            curl -sS --fail --max-time 60 --connect-timeout 10 \
              -X POST "${BASE_URL}/api/title" \
              -H "Authorization: ${AUTH}" \
              -H "Content-Type: application/json" \
              -d '{"userId":"all"}'

            echo ""
            echo "=== Done ==="
          on_retry_command: |
            DELAY_MINUTES=$((RANDOM % 16 + 5))
            echo "Task failed. Re-running in ${DELAY_MINUTES} minute(s)..."
            sleep $((DELAY_MINUTES * 60))
          retry_wait_seconds: 0
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
