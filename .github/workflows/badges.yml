name: Badge Queue Processor

on:
  schedule:
    # Run 5 minutes after sync (every 6 hours)
    - cron: '5 */6 * * *'
  workflow_dispatch:

jobs:
  process-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Process Pending Badge Queue
        run: |
          curl -X POST "${{ secrets.VERCEL_URL }}/api/badges/process-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
